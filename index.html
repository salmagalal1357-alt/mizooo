<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday!</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;900&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--text:#fff;--pink:#ff6b8b;--gold:#ffe135;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Cairo,system-ui,sans-serif;overflow:hidden}
*{box-sizing:border-box}
#stars{position:fixed;inset:0;z-index:0}
.page{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:1;transition:opacity .9s}
.page.hide{opacity:0;pointer-events:none}
#count{font-family:Cairo,sans-serif;font-weight:900;font-size:clamp(6rem,30vw,12rem);color:var(--gold);text-shadow:0 0 40px rgba(255,209,102,.6);min-height:1.2em;line-height:1.2}
#count.pop{animation:pop .9s ease-out}
@keyframes pop{0%{transform:scale(2.2);opacity:0}30%{opacity:1}100%{transform:scale(.8);opacity:.2}}
#title{font-family:Cairo,sans-serif;font-weight:900;letter-spacing:.02em;font-size:clamp(1.7rem,7.5vw,3.2rem);text-align:center;color:var(--gold);text-shadow:0 0 24px rgba(255,225,53,.55);min-height:1.4em;margin:0 0 6px}
#title::after{content:"|";animation:blink .7s steps(1) infinite;color:var(--text)}
#title.done::after{content:""}
@keyframes blink{50%{opacity:0}}
#cakeWrap{width:min(92vw,420px);opacity:0;transform:translateY(20px);transition:all 1s}
#cakeWrap.show{opacity:1;transform:none}
.under{margin:8px 0 0;text-align:center;font-weight:900;font-size:clamp(1rem,4.2vw,1.3rem);color:var(--gold);text-shadow:0 0 14px rgba(255,209,102,.5)}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:fl .5s ease-in-out infinite alternate}
@keyframes fl{from{transform:scale(1,1) rotate(-4deg)}to{transform:scale(.85,1.2) rotate(4deg)}}
#arena{position:relative;width:min(92vw,420px);height:130px;margin-top:10px;border:1px dashed rgba(255,255,255,.18);border-radius:18px;opacity:0;transition:opacity 1s}
#arena.show{opacity:1}
#go{position:absolute;left:0;top:0;border:0;border-radius:999px;padding:12px 22px;font:900 1.05rem Cairo,sans-serif;color:var(--gold);background:#1a1500;border:2px solid var(--gold);box-shadow:0 0 22px rgba(255,225,53,.5);cursor:pointer;white-space:nowrap}
#tease{margin:0;font-size:clamp(.8rem,3.2vw,1rem);font-weight:600;color:var(--gold);opacity:.85;text-align:center;letter-spacing:.03em}
#p2{background:#050b24;opacity:0;pointer-events:none;display:block;padding:0;overflow:hidden;z-index:2}
#p2.show{opacity:1;pointer-events:auto}
#p2.opened{overflow-y:auto;overflow-x:hidden}
#fx{position:fixed;inset:0;pointer-events:none;z-index:0}
#giftStage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s;z-index:3}
#giftSvg{width:min(60vw,240px);cursor:pointer;overflow:visible;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-9px)}}
#glow{opacity:0}
#lid{transition:transform .9s cubic-bezier(.3,1.4,.5,1),opacity .5s .5s;transform-box:fill-box;transform-origin:center}
#giftStage.open #lid{transform:translate(24px,-100px) rotate(25deg);opacity:0}
#giftStage.open #glow{opacity:.85;transition:opacity .5s}
#giftStage.open #giftSvg{animation:none}
#giftHint{color:var(--gold);font-weight:900;margin-top:14px}
#hintTop,#scroller{opacity:0;visibility:hidden;transition:opacity 1s}
#p2.opened #hintTop,#p2.opened #scroller{opacity:1;visibility:visible}
#hintTop{position:fixed;top:0;left:0;right:0;z-index:4;direction:rtl;text-align:center;font-weight:900;font-size:1.1rem;color:var(--gold);padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 22px;background:linear-gradient(#050b24 55%,rgba(5,11,36,0))}
#scroller{position:relative;z-index:1}
.gap{height:130vh}
#bookSec{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:70px 0}
.book{position:relative;width:min(92vw,430px);height:calc(min(92vw,430px)*1.5);perspective:1400px;opacity:0;transform:translateY(70px);transition:all 1.2s}
.book.in{opacity:1;transform:none}
.cover{position:absolute;inset:0;background:linear-gradient(135deg,#ffe34d,#ffc61a);border-radius:6px 14px 14px 6px;border-left:12px solid #d9a400;box-shadow:0 14px 40px rgba(0,0,0,.6),0 0 40px rgba(255,225,53,.25);transform-origin:left center;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:12px 14px;z-index:2;transition:transform 1.2s ease,opacity .5s .7s}
.cover.flip{transform:rotateY(-150deg);opacity:0}
.cover h2{margin:0;direction:rtl;text-align:center;font-weight:900;font-size:clamp(1.3rem,6.6vw,1.85rem);color:#3a2a00;line-height:1.35}
.photo{position:relative;width:60%;margin-top:38px}
.photo img{display:block;width:100%;border-radius:12px;border:4px solid #fff8e0;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.cap{position:absolute;left:47%;top:7%;width:42%;transform:translate(-50%,-92%) rotate(-7deg);overflow:visible;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
#openBook{border:0;border-radius:999px;padding:11px 22px;font:900 1rem Cairo,sans-serif;color:var(--gold);background:#0b1440;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.pagesBox{position:absolute;inset:0;border-radius:6px 14px 14px 6px;border:3px solid #c68642;background:linear-gradient(90deg,#e9c58f,#fffaf0 10%,#fffaf0 90%,#e2b97c);box-shadow:0 14px 40px rgba(0,0,0,.6);display:flex;flex-direction:column;padding:18px 18px 12px;color:#5b3a1a}
#paper{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;transition:opacity .3s;overflow-y:auto;overflow-x:hidden}
#paper>:first-child{margin-top:auto}#paper>:last-child{margin-bottom:auto}
#paper h3{margin:0 0 8px;font-weight:900;color:#a8651f}
.nav{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.nav button{border:0;border-radius:50%;width:38px;height:38px;font-size:1.4rem;font-weight:900;background:#c68642;color:#fff;cursor:pointer}
.stk{position:absolute;z-index:3;line-height:1;pointer-events:none;filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 4px 5px rgba(0,0,0,.3));animation:flt 3s ease-in-out infinite}
@keyframes flt{50%{translate:0 -6px}}
.pol{position:relative;width:84%;margin:2px 0 14px;padding:8px 8px 8px;background:#fff;border-radius:6px;box-shadow:0 5px 14px rgba(90,50,10,.35);transform:rotate(-2deg)}
.pol img{display:block;width:100%;border-radius:3px}
.tape{position:absolute;top:-11px;left:50%;width:70px;height:22px;margin-left:-35px;background:rgba(255,209,102,.8);transform:rotate(3deg)}
.pst{position:absolute;right:-12px;bottom:-14px;font-size:1.8rem;filter:drop-shadow(1px 0 0 #fff) drop-shadow(-1px 0 0 #fff) drop-shadow(0 1px 0 #fff) drop-shadow(0 -1px 0 #fff)}
.txt{width:100%;direction:rtl;text-align:right;white-space:pre-line;font-size:.98rem;line-height:1.9;font-weight:700;color:#5b3a1a}
#cakeWrap:not(.show) .flame{animation-play-state:paused}
.fin{font-family:'Great Vibes',cursive;font-weight:400;color:#d6213f;font-size:2.3rem;line-height:1.35;text-align:center;text-shadow:0 2px 8px rgba(214,33,63,.25)}
.endt{margin-top:22px;font-family:'Great Vibes',cursive;color:#d6213f;font-size:2rem;text-align:center}
#back{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:6;border:2px solid var(--gold);background:rgba(5,11,36,.88);color:var(--gold);font:900 .85rem Cairo,sans-serif;padding:7px 14px;border-radius:999px;cursor:pointer}
</style>
</head>
<body>
<canvas id="stars"></canvas>

<div class="page" id="p1">
  <div id="count"></div>
  <p id="tease">something extra special is waiting for mizoo</p>
  <h1 id="title" style="display:none"></h1>
  <div id="cakeWrap"></div>
  <div id="arena"><button id="go" dir="auto">press here يا عجوز</button></div>
</div>

<script>
// ---------- stars ----------
const cv=document.getElementById('stars'),ctx=cv.getContext('2d');let S=[];
function sz(){cv.width=innerWidth;cv.height=innerHeight;S=Array.from({length:380},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()<.12?Math.random()*1.2+1.6:Math.random()*1.3+.4,p:Math.random()*6}))}
sz();addEventListener('resize',sz);
let starAlpha=0;
const glow=document.createElement('canvas');glow.width=glow.height=24;
(()=>{const g=glow.getContext('2d'),r=g.createRadialGradient(12,12,0,12,12,12);r.addColorStop(0,'rgba(255,255,255,.9)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,24,24)})();
const p2n=document.getElementById('p2');
(function loop(t){
  if(p2n.classList.contains('show')){requestAnimationFrame(loop);return}
  ctx.clearRect(0,0,cv.width,cv.height);
  starAlpha=Math.min(1,starAlpha+.02);
  ctx.fillStyle='#fff';
  S.forEach(s=>{ctx.globalAlpha=starAlpha*(.4+.6*Math.abs(Math.sin(t/900+s.p)));
    if(s.r>1.6){const d=s.r*6;ctx.drawImage(glow,s.x-d/2,s.y-d/2,d,d)}else ctx.fillRect(s.x-s.r,s.y-s.r,s.r*2,s.r*2)});
  requestAnimationFrame(loop);
})(0);

// ---------- cake (3 layers, 20 candles) ----------
function candle(x,base,sc,col){
  const h=24*sc,w=5*sc;
  return `<rect x="${x-w/2}" y="${base-h}" width="${w}" height="${h}" rx="1.5" fill="${col}"/>
  <rect x="${x-w/2}" y="${base-h+4*sc}" width="${w}" height="${2*sc}" fill="rgba(255,255,255,.55)"/>
  <ellipse class="flame" style="animation-delay:${(Math.random()*.5).toFixed(2)}s" cx="${x}" cy="${base-h-6*sc}" rx="${3.2*sc}" ry="${6*sc}" fill="#ffb347"/>
  <ellipse class="flame" cx="${x}" cy="${base-h-4.5*sc}" rx="${1.6*sc}" ry="${3.5*sc}" fill="#fff4b0"/>`;
}
const cols=['#ff6b8b','#4cc9f0','#ffd166','#06d6a0','#b388eb'];
let back='',front='';
for(let i=0;i<10;i++){
  back+=candle(112+i*21,100,.85,cols[i%5]);
  front+=candle(123+i*21,112,1,cols[(i+2)%5]);
}
document.getElementById('cakeWrap').innerHTML=`
<svg viewBox="0 20 400 270" width="100%" aria-label="Birthday cake with 20 candles">
  <ellipse cx="200" cy="282" rx="190" ry="10" fill="#222"/>
  <rect x="20" y="210" width="360" height="70" rx="12" fill="#ff8fab"/>
  <path d="M20 222 q20 24 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 v-12 h-360z" fill="#fff0f5"/>
  <rect x="55" y="150" width="290" height="60" rx="12" fill="#ffc2d1"/>
  <path d="M55 160 q18 22 36 0 t36 0 t36 0 t36 0 t36 0 t36 0 t36 0 t36 0 v-10 h-290z" fill="#fff0f5"/>
  <rect x="90" y="95" width="220" height="55" rx="12" fill="#ff6b8b"/>
  <path d="M90 104 q14 20 28 0 t28 0 t28 0 t28 0 t28 0 t28 0 t28 0 t28 0 v-9 h-220z" fill="#fff0f5"/>
  <circle cx="130" cy="240" r="5" fill="#ffd166"/><circle cx="200" cy="248" r="5" fill="#4cc9f0"/><circle cx="270" cy="240" r="5" fill="#ffd166"/>
  <circle cx="165" cy="182" r="4" fill="#ff6b8b"/><circle cx="235" cy="182" r="4" fill="#ff6b8b"/>
  ${back}${front}
</svg>
<p class="under">20 candles for the 20 year old man 🕯️</p>`;

// ---------- sequence ----------
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function run(){
  await Promise.race([document.fonts.ready,wait(1200)]);await wait(700);
  const c=document.getElementById('count');
  for(let n=5;n>=0;n--){
    c.textContent=n;c.classList.remove('pop');void c.offsetWidth;c.classList.add('pop');
    await wait(1000);
  }
  c.style.display='none';document.getElementById('tease').style.display='none';
  const t=document.getElementById('title');
  const msg='happy birthday ya mazmozyyy';
  t.innerHTML=[...msg].map(ch=>'<span style="opacity:0">'+ch+'</span>').join('');
  t.style.display='block';t.classList.add('done');
  const sp=t.children,t0=performance.now();
  await new Promise(res=>{(function f(now){const n=Math.min(sp.length,Math.floor((now-t0)/40)+1);for(let k=0;k<n;k++)sp[k].style.opacity=1;n<sp.length?requestAnimationFrame(f):res()})(t0)});
  document.getElementById('cakeWrap').classList.add('show');
  await wait(900);
  document.getElementById('arena').classList.add('show');
  startDrift();
}
run();

// ---------- moving button in a limited area ----------
const arena=document.getElementById('arena'),go=document.getElementById('go');
let bx=20,by=40,vx=1.4,vy=1.0,drifting=false;
function startDrift(){
  if(drifting)return;drifting=true;
  bx=Math.random()*(arena.clientWidth-go.offsetWidth);by=Math.random()*(arena.clientHeight-go.offsetHeight);
  (function step(){
    const maxX=arena.clientWidth-go.offsetWidth,maxY=arena.clientHeight-go.offsetHeight;
    bx+=vx;by+=vy;
    if(bx<=0||bx>=maxX){vx=-vx*(0.9+Math.random()*.3);bx=Math.max(0,Math.min(maxX,bx))}
    if(by<=0||by>=maxY){vy=-vy*(0.9+Math.random()*.3);by=Math.max(0,Math.min(maxY,by))}
    const sp=Math.hypot(vx,vy);if(sp>2.2){vx*=2.2/sp;vy*=2.2/sp}if(sp<1){vx*=1.3;vy*=1.3}
    go.style.transform=`translate(${bx}px,${by}px)`;
    requestAnimationFrame(step);
  })();
}

// ---------- go to page 2 ----------
go.addEventListener('click',()=>{
  document.getElementById('p1').classList.add('hide');
  setTimeout(()=>document.getElementById('p2').classList.add('show'),700);
});
// ---------- page 2 ----------
const p2el=document.getElementById('p2');let giftOpened=false;
function openGift(){
  if(giftOpened)return;giftOpened=true;
  const st=document.getElementById('giftStage');st.classList.add('open');
  setTimeout(()=>{st.style.opacity=0;p2el.classList.add('opened');startFx()},1300);
  setTimeout(()=>{st.style.display='none'},2200);
}
// hearts & stars rushing up
const fx=document.getElementById('fx'),fc=fx.getContext('2d');let P=[],fxOn=false;
function fsz(){fx.width=innerWidth;fx.height=innerHeight}fsz();addEventListener('resize',fsz);
const BL=['#1b2f8f','#2442b8','#16256b','#2f55d4','#1d3a9e'];
function spawn(low){P.push({x:Math.random()*fx.width,y:fx.height+40+(low?Math.random()*500:0),s:10+Math.random()*26,vy:1.3+Math.random()*3.2,r:Math.random()*6,vr:(Math.random()-.5)*.04,ph:Math.random()*6,h:Math.random()<.55,c:BL[Math.floor(Math.random()*5)]})}
function startFx(){fxOn=true;for(let i=0;i<60;i++)spawn(true)}
function drawShape(p){
  fc.save();fc.translate(p.x,p.y);fc.rotate(p.r);fc.scale(p.s/30,p.s/30);
  fc.fillStyle=p.c;fc.strokeStyle='rgba(120,160,255,.55)';fc.lineWidth=2;fc.beginPath();

let pi=0;const paper=document.getElementById('paper'),pn=document.getElementById('pn');
function showPage(){paper.style.opacity=0;setTimeout(()=>{const p=PAGES[pi];paper.innerHTML='';paper.scrollTop=0;
  if(p.t){const e=document.createElement('h3');e.textContent=p.t;paper.append(e)}
  if(p.img){const d=document.createElement('div');d.className='pol';if(p.tilt)d.style.transform='rotate('+p.tilt+'deg)';d.innerHTML='<img alt="" src="'+p.img+'"><span class="tape"></span><span class="pst">'+(p.st||'💖')+'</span>';paper.append(d)}
  const x=document.createElement('div');x.className='txt'+(p.cls?' '+p.cls:'');x.textContent=p.b;if(!p.rtl){x.dir='ltr';x.style.textAlign='center'}paper.append(x);if(p.end){const n=document.createElement('div');n.className='endt';n.textContent=p.end;paper.append(n)}
  pn.textContent=(pi+1)+' / '+PAGES.length;paper.style.opacity=1},250)}
document.getElementById('prev').onclick=()=>{pi=(pi+PAGES.length-1)%PAGES.length;showPage()};
document.getElementById('next').onclick=()=>{pi=(pi+1)%PAGES.length;showPage()};
showPage();
document.getElementById('openBook').onclick=()=>{
  const c=document.getElementById('cover');c.classList.add('flip');
  setTimeout(()=>{c.style.visibility='hidden'},1300);
};

document.getElementById('back').onclick=()=>{
  const c=document.getElementById('cover');
  if(c.classList.contains('flip')){
    if(pi>0){pi--;showPage()}
    else{c.style.visibility='visible';c.classList.remove('flip')}
  }else{
    p2el.classList.remove('show');document.getElementById('p1').classList.remove('hide');
  }
};
